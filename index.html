
<!-- index.html (메인 홈) -->

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Forest</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    color:#222;
}

header{
    background:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
    top:0;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#ff7b00;
    text-decoration: none;
}
.hero{
    height:500px;
    background:url("https://images.unsplash.com/photo-1510915361894-db8b60106cb1?q=80&w=1400&auto=format&fit=crop") center/cover;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.hero-box{
    background:rgba(255,255,255,0.9);
    padding:40px;
    border-radius:20px;
    text-align:center;
    max-width:700px;
}

.hero-box h1{
    font-size:55px;
    color:#ff7b00;
    margin-bottom:20px;
}

.hero-box p{
    font-size:20px;
    line-height:1.7;
}


.section{
    padding:70px 20px;
}

.section-title{
    text-align:center;
    font-size:40px;
    margin-bottom:40px;
    color:#ff7b00;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
}

.card-content{
    padding:25px;
}

.card-content h3{
    margin-bottom:15px;
    color:#ff7b00;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:50px;
}

.menu-bar{
    background:white;
    display:flex;
    justify-content:center;
    gap:40px;
    padding:20px;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:999;
}

.menu-bar a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
    font-size:18px;
    transition:0.3s;
}

.menu-bar a:hover{
    color:#ff7b00;
}

@media(max-width:768px){

    .menu-bar{
        flex-wrap:wrap;
        gap:20px;
    }

}

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:15px;
    }

    .hero{
        height:350px;
    }

    .hero-box h1{
        font-size:35px;
    }

    .hero-box p{
        font-size:15px;
    }

}

</style>
</head>

<body>
    
    <header>
        
        <a href="index.html" class="logo">🌲 Guitar Forest 🌲</a>

    </header>
    
    <section class="hero">

        <div class="hero-box">

            <h1>Guitar Forest</h1>

            <p>
                통기타 · 일렉기타 · 베이스기타 강의와<br>
                다양한 악보 자료를 제공합니다.
            </p>
            
        </div>

    </section>

    <!-- MENU -->

    <div class="menu-bar">
    
        <a href="index.html">홈</a>
        <a href="lesson.html">강의</a>
        <a href="sheet.html">악보</a>
        <a href="contact.html">문의</a>

    </div>
    <footer>
        © 2026 Guitar Forest
    </footer>

</body>
</html>
