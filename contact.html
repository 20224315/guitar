<!-- contact.html (문의 페이지) -->

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의 게시판</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    color:#222;
}

header{
    background:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
}

.logo{
    text-decoration:none;
    color:#ff7b00;
    font-size:28px;
    font-weight:bold;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

nav a:hover{
    color:#ff7b00;
}

.section{
    padding:60px 20px;
}

.title{
    text-align:center;
    font-size:42px;
    color:#ff7b00;
    margin-bottom:40px;
}

.write-box{
    background:white;
    max-width:900px;
    margin:auto;
    padding:30px;
    border-radius:20px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    margin-bottom:40px;
}

.write-box input,
.write-box textarea{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

.write-box textarea{
    resize:none;
}

.write-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff7b00;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.write-btn:hover{
    background:#ff9433;
}

.posts{
    max-width:900px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:25px;
}

.post{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.post-title{
    color:#ff7b00;
    font-size:28px;
    margin-bottom:15px;
}

.post-name{
    color:#888;
    margin-bottom:20px;
    font-size:14px;
}

.post-content{
    line-height:1.8;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:60px;
}

@media(max-width:768px){

    header{
        flex-direction:column;
        gap:15px;
    }

    nav{
        flex-wrap:wrap;
        justify-content:center;
    }

    .title{
        font-size:30px;
    }

    .post-title{
        font-size:22px;
    }

}
.reply-section{
    margin-top:25px;
}

.reply-btn{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#ff7b00;
    color:white;
    cursor:pointer;
}

.reply-box{
    display:none;
    margin-top:15px;
}

.reply-input{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
    resize:none;
    margin-bottom:10px;
}

.send-reply-btn{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#333;
    color:white;
    cursor:pointer;
}

.reply-list{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.reply{
    background:#fff3e8;
    padding:20px;
    border-radius:15px;
    border-left:5px solid #ff7b00;
}

.reply-name{
    font-weight:bold;
    color:#ff7b00;
    margin-bottom:10px;
}

.delete-reply-btn{
    margin-top:15px;
    padding:8px 12px;
    border:none;
    border-radius:10px;
    background:#ff4d4d;
    color:white;
    cursor:pointer;
}

.delete-reply-btn:hover{
    opacity:0.8;
}


.delete-post-btn{
    margin-top:20px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#ff4d4d;
    color:white;
    cursor:pointer;
}

.delete-post-btn:hover{
    opacity:0.8;
}
</style>
</head>

<body>
    
    <header>
        
        <a href="index.html" class="logo">🌲 Guitar Forest 🌲</a>
        
        <nav>
            <a href="index.html">홈</a>
            <a href="lesson.html">강의</a>
            <a href="sheet.html">악보</a>
            <a href="contact.html">문의</a>
        </nav>
    
    </header>
    
    <section class="section">
        
        <h1 class="title">📩 문의 게시판</h1>
        
        <div class="write-box">
            
            <input type="text" id="nameInput" placeholder="이름">
            
            <input type="text" id="titleInput" placeholder="제목">
            
            <textarea id="contentInput" rows="8" placeholder="문의 내용을 입력하세요"></textarea>
            
            <button class="write-btn" onclick="addPost()"> 문의 작성하기 </button>
        
        </div>
        
        <div class="posts" id="posts">
            
            <div class="post"> 
                
                <h2 class="post-title">사이트 문의드립니다</h2>
                
                <div class="post-name">작성자 : 기타초보</div>
                
                <div class="post-content">통기타 강의는 언제 업데이트되나요?</div>

                <button class="delete-post-btn"onclick="deletePost(this)">문의 삭제</button>
                
                <div class="reply-section">
                    
                    <button class="reply-btn" onclick="toggleReply(this)">답장하기</button>
                    
                    <div class="reply-box">
                        
                        <textarea class="reply-input" rows="4" placeholder="답장을 입력하세요"></textarea>
                        
                        <button class="send-reply-btn" onclick="addReply(this)">답장 등록</button>
                    
                    </div>
                    
                    <div class="reply-list"></div>
                
                </div>
            
            </div>
        
        </div>
    
    </section>

    <footer>
        © 2026 Guitar Forest
    </footer>
    
    <script>
    
    function addPost(){

        const name =
        document.getElementById("nameInput").value;

        const title =
        document.getElementById("titleInput").value;

        const content =
        document.getElementById("contentInput").value;

        if(name === "" || title === "" || content === ""){

            alert("모든 내용을 입력해주세요.");

            return;

        }

        const post =
        document.createElement("div");

        post.classList.add("post");

        post.innerHTML = `

        <h2 class="post-title">
            ${title}
        </h2>

        <div class="post-name">
            작성자 : ${name}
        </div>

        <div class="post-content">
    ${content}
        </div>

        <button class="delete-post-btn" onclick="deletePost(this)">문의 삭제</button>

        <!-- 답장 기능 -->

        <div class="reply-section">

            <button
            class="reply-btn"
            onclick="toggleReply(this)"
            >
            답장하기
            </button>

            <div class="reply-box">

                <textarea
                class="reply-input"
                rows="4"
                placeholder="답장을 입력하세요"
                ></textarea>

                <button
                class="send-reply-btn"
                onclick="addReply(this)"
                >
                답장 등록
                </button>

            </div>

            <div class="reply-list"></div>

        </div>

        `;

        document.getElementById("posts")
        .prepend(post);

        document.getElementById("nameInput").value = "";

        document.getElementById("titleInput").value = "";

        document.getElementById("contentInput").value = "";

        savePosts();

    }

    function toggleReply(button){

        const replyBox =
        button.nextElementSibling;

        if(replyBox.style.display === "block"){

            replyBox.style.display = "none";

        }else{

            replyBox.style.display = "block";

        }

    }

    function addReply(button){

        const replyBox =
        button.parentElement;

        const input =
        replyBox.querySelector(".reply-input");

        const text =
        input.value;

        if(text === ""){

            alert("답장을 입력해주세요.");

            return;

        }

        const replyList =
        replyBox.nextElementSibling;

        const reply =
        document.createElement("div");

        reply.classList.add("reply");

        reply.innerHTML = `

        <div class="reply-name">
            관리자 답변
        </div>

        <div class="reply-text">
            ${text}
        </div>

        <button
        class="delete-reply-btn"
        onclick="deleteReply(this)"
        >
        삭제
        </button>

        `;

        replyList.appendChild(reply);

        input.value = "";

        savePosts();

    }

    function deleteReply(button){

        button.parentElement.remove();

        savePosts();

}

    window.onload = function(){

    const savedPosts =
    localStorage.getItem("contactPosts");

    if(savedPosts){

        document.getElementById("posts").innerHTML =
        savedPosts;

    }

    

    const posts =
    document.querySelectorAll(".post");

    posts.forEach(post => {

        if(!post.querySelector(".delete-post-btn")){

            const button =
            document.createElement("button");

            button.classList.add("delete-post-btn");

            button.innerText = "문의 삭제";

            button.setAttribute(

                "onclick",

                "deletePost(this)"

            );

            const replySection =
            post.querySelector(".reply-section");

            post.insertBefore(

                button,

                replySection

            );

        }

    });

}

    function savePosts(){

        localStorage.setItem(

            "contactPosts",

            document.getElementById("posts").innerHTML

        );

    }

    function deletePost(button){

        button.parentElement.remove();

        savePosts();

    }
    </script>

</body>
</html>
