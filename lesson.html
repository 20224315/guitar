<!-- lesson.html (강의 페이지) -->

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 페이지</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f4f4;
}

header{
    background:white;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
}

.logo{
    color:#ff7b00;
    font-size:20px;
    font-weight:bold;
    text-decoration: none;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.section{
    padding:60px 20px;
}

.title{
    text-align:center;
    color:#ff7b00;
    margin-bottom:40px;
    font-size:40px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.content{
    padding:25px;
}

.content h2{
    color:#ff7b00;
}

.content p{
    line-height:1.7;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:25px;
    margin-top:50px;
}
.lesson-link{
    text-decoration:none;
    color:inherit;
}

.lesson-link .card{
    transition:0.3s;
}

.lesson-link .card:hover{
    transform:translateY(-8px);
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

</style>
</head>

<body>
    <header>
    
        <a href="index.html" class="logo">🌲 Guitar Forest 🌲</a>
        
        <nav>
            <a href="index.html">홈</a>
            <a href="lesson.html">강의</a>
            <a href="sheet.html">악보</a>
            <a href="contact.html">문의</a>
        </nav>

    </header>
